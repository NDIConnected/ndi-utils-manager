name: Release (Linux packages)

# Builds the Linux x86_64 packages and attaches them to a GitHub release.
# Runs when a release is published, or manually for an existing tag (e.g. to add Linux files to it).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the Linux packages to (e.g. 3.4)
        required: true

permissions:
  contents: write

jobs:
  linux-packages:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ndi-web-ui/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Package
        run: ./scripts/package-linux.sh

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/linux/* --clobber
